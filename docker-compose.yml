version: '3.9'

services:
  kaggle-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: megacompact-kaggle-bridge
    
    # Mount credentials and output directories
    volumes:
      # Kaggle credentials (read-only for security)
      - ~/.kaggle:/home/kaggle/.kaggle:ro
      # Output directory for results
      - ./kaggle_extracted_ledgers:/app/kaggle_extracted_ledgers
    
    # Environment configuration
    environment:
      HOME: /home/kaggle
      KAGGLE_CONFIG_DIR: /home/kaggle/.kaggle
      PYTHONUNBUFFERED: '1'
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Restart policy for cloud resilience
    restart: no
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "test -f $KAGGLE_CONFIG_DIR/kaggle.json"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Interactive terminal for debugging (optional: comment out for production)
    stdin_open: true
    tty: true
