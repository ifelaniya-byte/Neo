<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Ultra Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        /* Animated background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
            animation: backgroundMove 20s ease-in-out infinite;
        }

        @keyframes backgroundMove {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-10%, -10%); }
            50% { transform: translate(10%, 10%); }
            75% { transform: translate(-5%, 5%); }
        }

        /* Glassmorphism header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .header h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        .header .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.4em;
            position: relative;
            z-index: 1;
            font-weight: 300;
        }

        /* Achievements section */
        .achievements-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .achievements-section h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .achievement {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .achievement::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .achievement.unlocked::before {
            transform: scaleX(1);
        }

        .achievement:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .achievement-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .achievement.unlocked .achievement-icon {
            filter: grayscale(0%);
            animation: achievementGlow 2s ease-in-out infinite;
        }

        @keyframes achievementGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.8)); }
        }

        .achievement-name {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .achievement-date {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Personalized insights */
        .insights-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .insights-section h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .insight-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .insight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea, #764ba2);
        }

        .insight-card:hover {
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .insight-title {
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .insight-content {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        /* Main grade display */
        .grade-display {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            position: relative;
        }

        .overall-grade {
            font-size: 6em;
            font-weight: bold;
            padding: 40px 80px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            color: white;
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.4);
            animation: pulseGlow 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes pulseGlow {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 15px 50px rgba(102, 126, 234, 0.4); 
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 0 25px 70px rgba(102, 126, 234, 0.6); 
            }
        }

        .grade-A+, .grade-A { background: linear-gradient(135deg, rgba(17, 153, 142, 0.8) 0%, rgba(56, 239, 125, 0.8) 100%); }
        .grade-B { background: linear-gradient(135deg, rgba(86, 171, 47, 0.8) 0%, rgba(168, 224, 99, 0.8) 100%); }
        .grade-C { background: linear-gradient(135deg, rgba(247, 151, 30, 0.8) 0%, rgba(255, 210, 0, 0.8) 100%); }
        .grade-D { background: linear-gradient(135deg, rgba(255, 81, 47, 0.8) 0%, rgba(221, 36, 118, 0.8) 100%); }
        .grade-F { background: linear-gradient(135deg, rgba(203, 45, 62, 0.8) 0%, rgba(239, 71, 58, 0.8) 100%); }
        .grade-X { background: linear-gradient(135deg, rgba(67, 67, 67, 0.8) 0%, rgba(0, 0, 0, 0.8) 100%); }

        /* Dashboard grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.3);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .metric-row:hover {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            padding-left: 15px;
        }

        .metric-label {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .metric-value {
            font-weight: bold;
            color: #ffffff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            transition: width 1s ease;
            border-radius: 10px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: progressShimmer 2s infinite;
        }

        @keyframes progressShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 0.95em;
            font-weight: bold;
            margin: 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-badge:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .status-NORMAL { background: linear-gradient(135deg, rgba(17, 153, 142, 0.8) 0%, rgba(56, 239, 125, 0.8) 100%); color: white; }
        .status-WARNING { background: linear-gradient(135deg, rgba(247, 151, 30, 0.8) 0%, rgba(255, 210, 0, 0.8) 100%); color: white; }
        .status-CRITICAL { background: linear-gradient(135deg, rgba(203, 45, 62, 0.8) 0%, rgba(239, 71, 58, 0.8) 100%); color: white; }
        .status-DEGRADED { background: linear-gradient(135deg, rgba(131, 77, 155, 0.8) 0%, rgba(208, 78, 214, 0.8) 100%); color: white; }
        .status-DEAD { background: linear-gradient(135deg, rgba(67, 67, 67, 0.8) 0%, rgba(0, 0, 0, 0.8) 100%); color: white; }

        /* Alerts section */
        .alerts-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .alerts-section h2 {
            color: #ff6b6b;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .alert-item {
            padding: 20px 25px;
            margin: 15px 0;
            border-radius: 15px;
            background: rgba(255, 107, 107, 0.1);
            border-left: 4px solid #ff6b6b;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .alert-item:hover {
            transform: translateX(10px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
        }

        .alert-item::before {
            content: '⚠️';
            font-size: 1.5em;
        }

        /* Real-time performance chart */
        .performance-chart {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .performance-chart h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chart-container {
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .chart-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            display: flex;
            align-items: flex-end;
            gap: 5px;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 5px 5px 0 0;
            transition: height 0.5s ease;
            position: relative;
        }

        .chart-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            animation: barGlow 2s infinite;
        }

        @keyframes barGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .refresh-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            border-radius: 35px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .refresh-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .refresh-button:hover::before {
            left: 100%;
        }

        .refresh-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .refresh-button:active {
            transform: translateY(0);
        }

        /* Footer */
        .timestamp {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
            margin-top: 30px;
            text-align: right;
            font-style: italic;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }

            .overall-grade {
                font-size: 4em;
                padding: 30px 50px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .achievements-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Loading animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <div class="header">
            <h1>Neo Ultra Dashboard</h1>
            <div class="subtitle">Advanced AI Performance Monitoring System</div>
        </div>

        <div class="achievements-section">
            <h2>🏆 Achievements</h2>
            <div class="achievements-grid" id="achievementsGrid">
                <!-- Achievements will be loaded dynamically -->
            </div>
        </div>

        <div class="insights-section">
            <h2>💡 Personalized Insights</h2>
            <div id="insightsContainer">
                <!-- Insights will be loaded dynamically -->
            </div>
        </div>

        <div class="grade-display">
            <div class="overall-grade" id="overallGrade">A+</div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>🎯 Performance Metrics</h3>
                <div id="performanceMetrics">
                    <!-- Performance metrics will be loaded dynamically -->
                </div>
            </div>

            <div class="card">
                <h3>🛡️ Survival Status</h3>
                <div id="survivalMetrics">
                    <!-- Survival metrics will be loaded dynamically -->
                </div>
            </div>

            <div class="card">
                <h3>🔗 API Health</h3>
                <div id="apiMetrics">
                    <!-- API metrics will be loaded dynamically -->
                </div>
            </div>

            <div class="card">
                <h3>🔄 Karpathy Loop</h3>
                <div id="karpathyMetrics">
                    <!-- Karpathy loop metrics will be loaded dynamically -->
                </div>
            </div>
        </div>

        <div class="performance-chart">
            <h2>📊 Real-Time Performance</h2>
            <div class="chart-container">
                <div class="chart-line" id="performanceChart">
                    <!-- Chart bars will be loaded dynamically -->
                </div>
            </div>
        </div>

        <div class="alerts-section">
            <h2>🚨 System Alerts</h2>
            <div id="alertsContainer">
                <!-- Alerts will be loaded dynamically -->
            </div>
        </div>

        <div class="controls">
            <button class="refresh-button" onclick="refreshData()">🔄 Refresh Data</button>
            <button class="refresh-button" onclick="clearAlerts()">🧹 Clear Alerts</button>
        </div>

        <div class="timestamp" id="timestamp">Last updated: --</div>
    </div>

    <script>
        // Initialize dashboard
        let neoStatus = null;
        let achievements = [
            { id: 'first_boot', name: 'First Boot', icon: '🚀', unlocked: true, date: '2026-08-05' },
            { id: 'perfect_score', name: 'Perfect Score', icon: '💯', unlocked: true, date: '2026-08-05' },
            { id: 'fast_learner', name: 'Fast Learner', icon: '📚', unlocked: true, date: '2026-08-05' },
            { id: 'autonomous', name: 'Autonomous Mode', icon: '🤖', unlocked: false, date: null },
            { id: 'optimization_master', name: 'Optimization Master', icon: '⚡', unlocked: false, date: null },
            { id: 'memory_efficient', name: 'Memory Efficient', icon: '🧠', unlocked: false, date: null },
            { id: 'api_master', name: 'API Master', icon: '🔗', unlocked: false, date: null },
            { id: 'karpathy_veteran', name: 'Karpathy Veteran', icon: '🔄', unlocked: false, date: null }
        ];

        let insights = [
            { title: 'Performance Excellence', content: 'Your accuracy has improved by 15% over the last week. Keep up the great work!' },
            { title: 'Memory Optimization', content: 'Memory usage is optimal. Consider enabling advanced compaction for even better performance.' },
            { title: 'API Efficiency', content: 'API response times are excellent. Current optimization strategies are working well.' }
        ];

        async function loadNeoStatus() {
            try {
                const response = await fetch('/api/neo-status');
                if (response.ok) {
                    neoStatus = await response.json();
                    return true;
                }
            } catch (error) {
                console.error('Failed to load Neo status:', error);
            }
            return false;
        }

        function renderAchievements() {
            const grid = document.getElementById('achievementsGrid');
            grid.innerHTML = achievements.map(achievement => `
                <div class="achievement ${achievement.unlocked ? 'unlocked' : ''}">
                    <div class="achievement-icon">${achievement.icon}</div>
                    <div class="achievement-name">${achievement.name}</div>
                    <div class="achievement-date">${achievement.date || 'Locked'}</div>
                </div>
            `).join('');
        }

        function renderInsights() {
            const container = document.getElementById('insightsContainer');
            container.innerHTML = insights.map(insight => `
                <div class="insight-card">
                    <div class="insight-title">${insight.title}</div>
                    <div class="insight-content">${insight.content}</div>
                </div>
            `).join('');
        }

        function renderMetrics() {
            if (!neoStatus) return;

            // Overall grade
            const gradeElement = document.getElementById('overallGrade');
            gradeElement.textContent = neoStatus.overall_grade || 'A+';
            gradeElement.className = 'overall-grade grade-' + (neoStatus.overall_grade || 'A+');

            // Performance metrics
            const performanceContainer = document.getElementById('performanceMetrics');
            const performance = neoStatus.performance || {};
            performanceContainer.innerHTML = `
                <div class="metric-row">
                    <span class="metric-label">Accuracy</span>
                    <span class="metric-value">${(performance.accuracy * 100).toFixed(1)}%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${performance.accuracy * 100}%"></div>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Loss</span>
                    <span class="metric-value">${performance.loss?.toFixed(4) || 'N/A'}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">MMLU Score</span>
                    <span class="metric-value">${performance.mmlu?.toFixed(1) || 'N/A'}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">HumanEval</span>
                    <span class="metric-value">${performance.humaneval?.toFixed(1) || 'N/A'}%</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Inference Time</span>
                    <span class="metric-value">${performance.inference_time?.toFixed(1) || 'N/A'}ms</span>
                </div>
            `;

            // Survival metrics
            const survivalContainer = document.getElementById('survivalMetrics');
            const survival = neoStatus.survival || {};
            survivalContainer.innerHTML = `
                <div class="metric-row">
                    <span class="metric-label">Frozen Units</span>
                    <span class="metric-value">${survival.frozen_units || 0}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Consecutive Failures</span>
                    <span class="metric-value">${survival.consecutive_failures || 0}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Total Failures</span>
                    <span class="metric-value">${survival.total_failures || 0}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Total Successes</span>
                    <span class="metric-value">${survival.total_successes || 0}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Memory Punishment Rate</span>
                    <span class="metric-value">${survival.memory_punishment_rate?.toFixed(2) || 'N/A'}x</span>
                </div>
            `;

            // API metrics
            const apiContainer = document.getElementById('apiMetrics');
            const api = neoStatus.api || {};
            apiContainer.innerHTML = `
                <div class="metric-row">
                    <span class="metric-label">Daily Usage</span>
                    <span class="metric-value">${api.daily_usage || 0}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Remaining Credits</span>
                    <span class="metric-value">${api.remaining_credits || 0}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Efficiency Score</span>
                    <span class="metric-value">${(api.efficiency_score * 100).toFixed(1)}%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${api.efficiency_score * 100}%"></div>
                </div>
            `;

            // Karpathy loop metrics
            const karpathyContainer = document.getElementById('karpathyMetrics');
            const karpathy = neoStatus.karpathy_loop || {};
            karpathyContainer.innerHTML = `
                <div class="metric-row">
                    <span class="metric-label">Loop Count</span>
                    <span class="metric-value">${karpathy.loop_count || 0}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Improvement Rate</span>
                    <span class="metric-value">${(karpathy.improvement_rate * 100).toFixed(1)}%</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Last Improvement</span>
                    <span class="metric-value">${karpathy.last_improvement || 'N/A'}</span>
                </div>
            `;

            // Alerts
            const alertsContainer = document.getElementById('alertsContainer');
            const alerts = neoStatus.alerts || [];
            if (alerts.length === 0) {
                alertsContainer.innerHTML = '<div style="color: rgba(255,255,255,0.6);">No active alerts</div>';
            } else {
                alertsContainer.innerHTML = alerts.map(alert => `
                    <div class="alert-item">${alert}</div>
                `).join('');
            }

            // Update timestamp
            document.getElementById('timestamp').textContent = 
                'Last updated: ' + new Date().toLocaleString();
        }

        function renderPerformanceChart() {
            const chart = document.getElementById('performanceChart');
            // Generate simulated performance data
            const bars = [];
            for (let i = 0; i < 30; i++) {
                const height = 50 + Math.random() * 50;
                bars.push(`<div class="chart-bar" style="height: ${height}%"></div>`);
            }
            chart.innerHTML = bars.join('');
        }

        async function refreshData() {
            const button = event.target;
            button.disabled = true;
            button.textContent = '⏳ Loading...';

            await loadNeoStatus();
            renderMetrics();
            renderPerformanceChart();

            button.disabled = false;
            button.textContent = '🔄 Refresh Data';
        }

        async function clearAlerts() {
            try {
                await fetch('/api/neo-status/alerts/clear', { method: 'POST' });
                await loadNeoStatus();
                renderMetrics();
            } catch (error) {
                console.error('Failed to clear alerts:', error);
            }
        }

        // Add ripple effect to buttons
        document.querySelectorAll('.refresh-button').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const rect = this.getBoundingClientRect();
                ripple.style.left = e.clientX - rect.left + 'px';
                ripple.style.top = e.clientY - rect.top + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Initialize dashboard
        async function init() {
            renderAchievements();
            renderInsights();
            renderPerformanceChart();
            await loadNeoStatus();
            renderMetrics();

            // Auto-refresh every 30 seconds
            setInterval(async () => {
                await loadNeoStatus();
                renderMetrics();
                renderPerformanceChart();
            }, 30000);
        }

        init();
    </script>
</body>
</html>
