version: "3.8"

services:
  claw-os:
    build: .
    container_name: claw-os
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # Change the left side to your actual media folder on the host
      - /path/to/your/media/folder:/data
      - ../.env:/app/.env:ro
    # Optional: if using Ollama on the host
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # environment:
    #   - OLLAMA_BASE_URL=http://host.docker.internal:11434
