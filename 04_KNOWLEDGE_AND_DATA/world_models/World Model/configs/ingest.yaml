# Historical data ingestion configuration
mode: parquet
preset: ingest

# Input
input:
  path: null  # Set via --input flag
  format: parquet  # or csv
  chain_id: 42161  # Arbitrum
  max_feature_age_ms: 5000

# Data validation
validation:
  allow_duplicate_events: false
  require_block_hash: true
  require_tx_hash: false
  max_staleness_ms: 10000
  negative_value_check: true

# Splits
splits:
  train_fraction: 0.5
  validation_fraction: 0.15
  calibration_fraction: 0.15
  test_fraction: 0.2

# Model architecture
model:
  tabular_hidden: 128
  action_hidden: 64
  temporal_hidden: 128
  latent_dim: 192
  ensemble_size: 5
  dropout: 0.15
  learning_rate: 0.0005
  batch_size: 64
  epochs: 20
  early_stopping_patience: 5

# Calibration
calibration:
  confidence_level: 0.90
  min_regime_samples: 50

# Planning
planning:
  lambda_uncertainty: 1.5
  lambda_cvar: 0.7
  lambda_revert: 2.5
  lambda_delay: 0.7
  min_net_edge_usd: 1.0
  max_revert_probability: 0.03
  min_inclusion_probability: 0.90
  ood_threshold: 0.7

# Constraints
constraints:
  max_price_impact_bps: 50
  max_gas_usd: 5.0
  max_quote_age_ms: 3000
  max_loss_usd: 10.0

# Output
output:
  root: artifacts
  run_id: null  # Auto-generated
